# Versions match the ones Axon Framework 5.2.x is built and tested against.
[versions]
axon = "5.2.3"
hibernate = "7.4.4.Final"
jakarta-persistence = "3.2.0"
hikari = "7.1.0"
postgresql = "42.7.12"
logback = "1.5.18"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.1"
testcontainers = "2.0.5"
# Test coverage (JaCoCo Gradle plugin's agent and report); 0.8.14+ reads Java 25 class files
jacoco = "0.8.15"

[libraries]
# Axon Framework 5 (open source only; no io.axoniq.framework artifacts)
axon-bom = { module = "org.axonframework:axon-framework-bom", version.ref = "axon" }
axon-messaging = { module = "org.axonframework:axon-messaging" }
axon-modelling = { module = "org.axonframework:axon-modelling" }
axon-eventsourcing = { module = "org.axonframework:axon-eventsourcing" }
axon-test = { module = "org.axonframework:axon-test" }

jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api", version.ref = "jakarta-persistence" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core", version.ref = "hibernate" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
